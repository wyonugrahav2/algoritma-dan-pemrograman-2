[project]
name = "modul-04-algorithmic-scale"
version = "1.0.0"
description = "Stress testing engine untuk analisis skalabilitas algoritma & estimasi otomatis kelas Big-O (O(1) s.d. O(N^2))."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Algorithmic Scale Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
algorithmic-scale = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
