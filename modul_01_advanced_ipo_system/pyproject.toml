[project]
name = "advanced-ipo-system"
version = "1.0.0"
description = "Advanced IPO Problem Analysis - Decoupled Layer Architecture CLI System"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
ipo-cli = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["config*", "src*"]
